<title>Muslim Will Simulator</title>
<meta http-equiv="Cache-Control" content="no-store">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --parchment:#F3EEE5; --surface:#FBF8F3; --ink:#172033; --burgundy:#7A263A; --gray:#6E6A66; --border:#E7E1D8;
  --ink-2:#2B3448; --sunken:#EAE4DA; --burgundy-soft:#F0E1E3; --gold:#C8A45C; --white:#FFFFFF;
  --canvas:#DED8CE; --canvas-2:#D2CBBF; --canvas-ink:#3B3833;
  --serif:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --sh-card:0 1px 2px rgba(23,32,51,.04),0 4px 14px -8px rgba(23,32,51,.08);
  --sh-float:0 8px 24px rgba(23,32,51,.14);
  --sh-board:0 2px 4px rgba(23,32,51,.06),0 24px 48px -24px rgba(23,32,51,.28);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--canvas-ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ===== page: gallery left, simulator right ===== */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
@media (min-width:980px){.shell{grid-template-columns:minmax(0,1fr) 520px}}
.gallery{padding:24px clamp(16px,3vw,32px) 64px;min-width:0}
.gallery header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.gallery h1{font:800 22px/1 var(--serif);color:var(--ink);margin:0;letter-spacing:-.02em}
.gallery .sub{font-size:12.5px;color:var(--gray)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:22px}
.thumb{background:none;border:0;padding:0;text-align:left;color:var(--canvas-ink);border-radius:10px}
.thumb .cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;margin:0 2px 8px}
.thumb .cap span{font-weight:500;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .frame{width:100%;aspect-ratio:390/844;position:relative;overflow:hidden;border-radius:8px;box-shadow:var(--sh-board);background:var(--parchment);transition:transform .2s ease,box-shadow .2s ease}
.thumb .frame .board{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.thumb:hover .frame{transform:translateY(-2px)}
.thumb.on .frame{box-shadow:0 0 0 2px var(--ink),var(--sh-board)}
.sim{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 16px;background:var(--canvas-2);border-left:1px solid rgba(23,32,51,.08)}
@media (max-width:979px){.sim{position:relative;height:auto;order:-1;border-left:0;border-bottom:1px solid rgba(23,32,51,.08);padding:18px 12px 22px}}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.tool{border:1px solid rgba(23,32,51,.18);background:rgba(251,248,243,.6);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;line-height:1}
.tool:hover{background:var(--surface)}
.tool:disabled{opacity:.4;cursor:default}
.where{font-size:12px;color:var(--gray);font-weight:600}
.phone-wrap{width:calc(390px * var(--s,1));height:calc(844px * var(--s,1));position:relative;flex:0 0 auto}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--s,1));transform-origin:0 0;border-radius:44px;background:var(--ink);padding:8px;box-shadow:0 30px 60px -20px rgba(23,32,51,.5),0 0 0 1px rgba(23,32,51,.6)}
.phone .glass{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--parchment)}
.phone .notch{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:var(--ink);z-index:4}
.stage{position:absolute;inset:0}
.stage>.board{position:absolute;inset:0;width:100%;height:100%;border-radius:0;box-shadow:none;animation:in .28s cubic-bezier(.2,.8,.2,1)}
.stage>.board.back{animation:inback .24s ease}
@keyframes in{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes inback{from{transform:translateX(-18px);opacity:.5}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(60px)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.stage>.board,.sheet,.modal,.dim{animation:none!important}}
.toast{position:absolute;left:16px;right:16px;top:60px;z-index:8;background:var(--ink);color:var(--parchment);border-radius:16px;padding:14px 16px;font:700 13px/1.3 var(--sans);display:flex;gap:10px;align-items:center;box-shadow:var(--sh-float);animation:in .25s ease}
.toast svg{flex:0 0 auto}

/* ===== artboard base ===== */
.board{position:relative;width:390px;height:844px;background:var(--parchment);border-radius:8px;box-shadow:var(--sh-board);overflow:hidden;display:flex;flex-direction:column;color:var(--ink);font-family:var(--sans);font-size:15px}
.status{height:46px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:700}
.status i{display:inline-flex;gap:5px;align-items:center}
.status svg{display:block}
.grow{flex:1;min-height:0}
.scrollv{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scrollv::-webkit-scrollbar{display:none}
.home-ind{height:26px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.home-ind span{width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.9}
.logo{display:flex;align-items:center;gap:9px}
.logo .mark{width:26px;height:26px;flex:0 0 auto}
.logo b{font:800 17px/1 var(--serif);letter-spacing:-.02em;color:var(--ink)}
.logo small{display:block;font:700 8.5px/1 var(--sans);letter-spacing:.16em;color:var(--gray);margin-top:5px;text-transform:uppercase}

/* type (Jomo sizes, our faces) */
.eyebrow{font:700 11px/16px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gray);margin:0 0 8px}
.hl{font:800 26px/32px var(--serif);letter-spacing:-.02em;color:var(--ink);margin:0 0 10px;text-wrap:balance}
.hl em{font-style:italic;color:var(--burgundy)}
.body{font:500 15px/1.55 var(--sans);color:var(--gray);margin:0}
.screen-title{font:800 28px/1.2 var(--sans);letter-spacing:-.02em;margin:0;color:var(--ink)}
.screen-sub{font:500 13px/1.3 var(--sans);color:var(--gray);margin:2px 0 0}
.sec{display:flex;align-items:center;gap:6px;font:700 18px/1.2 var(--sans);color:var(--gray);margin:10px 0 2px;padding:0 4px;background:none;border:0;width:100%;text-align:left}
.sec .chev{width:12px;height:12px;flex:0 0 auto}
.sec .right{margin-left:auto;font:700 12px/1 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 12px}

/* buttons: Jomo pills */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:999px;border:0;font:700 16px/1 var(--sans);transition:transform .12s ease,background .15s ease;padding:0 20px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--parchment)}
.btn.primary:hover{background:var(--ink-2)}
.btn.primary:disabled{background:#CFC9BE;color:#F3EEE5;cursor:default}
.btn.secondary{background:var(--surface);color:var(--ink);box-shadow:var(--sh-float)}
.btn.secondary:hover{background:#fff}
.btn.tertiary{background:var(--sunken);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);height:44px;font-size:15px}
.btn.ghost:hover{background:rgba(23,32,51,.05)}
.btn.accent{background:var(--burgundy);color:var(--parchment)}
.btn svg{flex:0 0 auto}
.dock{padding:12px 16px 4px;display:grid;gap:8px;flex:0 0 auto}
.dock.two{grid-template-columns:1fr 1fr}
.round{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-float);border:0;display:grid;place-items:center;color:var(--ink);padding:0;position:relative}
.round.confirm{background:var(--ink);color:var(--parchment)}
.round.confirm.off{background:var(--sunken);color:#B7B1A6}
.round .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--burgundy);border:1.5px solid var(--surface)}
.link{background:none;border:0;padding:0;color:var(--ink);font:700 13px/1 var(--sans);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}

/* cards, rows, chips */
.pad{padding:0 16px}
.card{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--sh-card);display:grid;gap:10px}
.card.plain{background:var(--surface)}
.stack{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:0 16px 16px}
.stack>*{flex:0 0 auto}
.ctitle{display:flex;align-items:center;gap:10px;font:700 17px/1.2 var(--sans);color:var(--ink)}
.ctitle .ic{width:22px;height:22px;color:var(--ink);display:grid;place-items:center}
.ctitle .sp{flex:1}
.ctitle .chv{color:var(--gray)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font:600 12px/1 var(--sans);background:var(--sunken);color:var(--gray);white-space:nowrap}
.chip.live{background:var(--burgundy-soft);color:var(--burgundy)}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--burgundy)}
.chip.done{background:var(--ink);color:var(--parchment)}
.chip.num{background:var(--surface);border:1px solid var(--border);color:var(--ink);font-weight:700}
.dotsep{color:var(--border)}
.row{display:flex;align-items:center;gap:12px;min-height:44px;font:500 15px/1.3 var(--sans);color:var(--ink)}
.row+.row{border-top:1px solid var(--border)}
.row .ic{width:20px;height:20px;color:var(--gray);display:grid;place-items:center;flex:0 0 auto}
.row .t{flex:1;min-width:0}
.row .t small{display:block;font:400 13px/1.3 var(--sans);color:var(--gray);margin-top:2px}
.row .v{font:600 15px/1 var(--sans);color:var(--gray);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .chv{color:var(--gray);flex:0 0 auto}
.group{background:var(--surface);border-radius:16px;padding:0 16px;box-shadow:var(--sh-card)}
.group .row{min-height:52px}
.group button.row{background:none;border:0;width:100%;text-align:left;padding:0}
.create{border:1.5px dashed #CBC3B6;border-radius:16px;padding:12px 14px 12px 16px;display:flex;align-items:center;justify-content:space-between;color:var(--gray);font:500 14px/1.3 var(--sans);background:transparent;width:100%;text-align:left}
.create i{width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--ink);flex:0 0 auto;margin-left:10px}
.banner{background:var(--surface);border-radius:16px;padding:12px 16px;font:500 13px/1.45 var(--sans);color:var(--ink);box-shadow:var(--sh-card);display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--burgundy-soft);color:var(--burgundy);box-shadow:none;font-weight:600}
.banner b{font-weight:700}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center}
.stat3>div+div{border-left:1px solid var(--border)}
.stat3 small{display:block;font:500 13px/1.3 var(--sans);color:var(--gray)}
.stat3 b{display:block;font:700 20px/1.3 var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:5px;height:44px;padding-top:6px}
.bars i{flex:1;border-radius:3px 3px 0 0;background:var(--ink);opacity:.9}
.bars i.soft{background:var(--sunken);opacity:1}
.bars i.cur{background:var(--burgundy)}
.track{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.track span{display:block;height:100%;background:var(--ink);transition:width .4s ease}
.track.cap span{background:var(--burgundy)}
.toggle{width:46px;height:28px;border-radius:14px;background:#D6D0C6;position:relative;flex:0 0 auto;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on{background:var(--ink)}
.toggle.on::after{transform:translateX(18px)}
.seg{display:flex;background:var(--sunken);border-radius:999px;padding:3px;height:36px}
.seg button{flex:1;border:0;background:none;border-radius:999px;font:700 13px/1 var(--sans);color:var(--gray)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(23,32,51,.08)}
.search{height:44px;border-radius:999px;background:var(--sunken);display:flex;align-items:center;gap:8px;padding:0 16px;color:var(--gray);font:500 15px/1 var(--sans)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:44px;height:44px;border-radius:50%;border:0;background:var(--sunken);color:var(--ink);font:700 22px/1 var(--sans)}
.stepper b{font:800 44px/1 var(--serif);color:var(--ink);min-width:70px;text-align:center;font-variant-numeric:tabular-nums}

/* hero (Jomo home) */
.hero-top{height:56px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px}
.hero-top .mid{display:flex;align-items:center;gap:4px;font:700 14px/1 var(--sans);color:var(--ink);background:none;border:0}
.hero-top .icons{display:flex;gap:8px}
.hero{text-align:center;padding:16px 24px 10px}
.hero .lab{font:600 13px/1 var(--sans);color:var(--gray);margin:0 0 8px}
.hero .big{font:800 60px/1 var(--serif);letter-spacing:-.02em;color:var(--ink);margin:0;font-variant-numeric:tabular-nums}
.hero .big em{font-style:normal;color:var(--burgundy)}
.hero .stat-chip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;height:28px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:var(--sh-card);font:700 12px/1 var(--sans);color:var(--ink)}
.hero .stat-chip svg{color:var(--burgundy)}
.pager{display:flex;justify-content:center;gap:5px;margin:10px 0 4px}
.pager i{width:6px;height:6px;border-radius:50%;background:var(--border)}
.pager i.on{background:var(--ink)}

/* floating tab bar + floating CTA (Jomo) */
/* bottom nav, as on the home artboard: rounded card, line icons, burgundy indicator on the active tab */
.tabbar{position:absolute;left:24px;right:24px;bottom:22px;height:64px;border-radius:22px;background:var(--surface);border:1px solid rgba(231,225,216,.8);box-shadow:0 10px 24px -16px rgba(23,32,51,.2);display:flex;padding:6px 8px;z-index:3}
.tabbar button{flex:1;border:0;background:none;display:grid;justify-items:center;align-content:center;gap:4px;font:600 10.5px/1 var(--sans);color:#9A9F9B;padding:0;position:relative;border-radius:14px}
.tabbar button .ib{display:grid;place-items:center}
.tabbar button .ib svg{width:22px;height:22px}
.tabbar button .on-ic{display:none}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ib svg{stroke-width:1.9}
.tabbar button.on::after{content:"";position:absolute;bottom:2px;width:18px;height:3px;border-radius:2px;background:var(--burgundy)}
.tabbar button:hover:not(.on){color:var(--ink)}
.fab{position:absolute;left:24px;right:24px;width:auto;bottom:102px;z-index:3;box-shadow:var(--sh-float)}
.withbars{padding-bottom:12px;margin-bottom:104px}
.withfab{margin-bottom:170px}

/* home, as on the 393 × 852 artboard (scaled to the 390 × 844 simulator) */
.hm{padding:0 24px;flex:1;min-height:0;display:flex;flex-direction:column}
.hm .head{height:36px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between}
.hm .logo .mark{width:30px;height:30px}
.hm .logo b{font-size:18px}
.hm .acts{display:flex;align-items:center;gap:8px}
.hm .bell{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--ink);position:relative;padding:0}
.hm .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--burgundy);color:#fff;font:700 10px/18px var(--sans);text-align:center;padding:0 5px;border:2px solid var(--parchment)}
.hm .av36{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--parchment);display:grid;place-items:center;font:700 12px/1 var(--sans);letter-spacing:.04em;border:0;padding:0}
.hm .welcome{margin-top:22px;height:80px;flex:0 0 auto}
.hm .eb{font:700 11px/14px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gray);margin:0}
.hm h1{font:800 34px/38px var(--serif);letter-spacing:-.025em;margin:7px 0 7px;color:var(--ink)}
.hm .welcome p{font:500 15px/16px var(--sans);color:var(--gray);margin:0}
.hm .hero2{margin-top:22px;position:relative;height:196px;flex:0 0 auto;border-radius:24px;background:radial-gradient(120% 90% at 100% 0%,#2A3556 0%,var(--ink) 48%,#0F1526 100%);color:var(--parchment);padding:22px 24px;box-shadow:0 16px 36px -18px rgba(23,32,51,.42);overflow:hidden;display:flex;flex-direction:column}
.hm .hero2 .eb{color:rgba(243,238,229,.62)}
.hm .hero2 h2{font:800 24px/28px var(--serif);letter-spacing:-.02em;margin:8px 0 6px;color:#fff}
.hm .hero2 p{font:500 13px/18px var(--sans);color:rgba(243,238,229,.74);margin:0;max-width:210px}
.hm .hero2 .foot{margin-top:auto;display:flex;align-items:center;gap:12px}
.hm .ring{width:48px;height:48px;position:relative;flex:0 0 auto}
.hm .ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 11.5px/1 var(--sans);color:#fff}
.hm .steps{font:600 12.5px/16px var(--sans);color:rgba(243,238,229,.85);flex:1;min-width:0}
.hm .cta{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);font:700 14px/1 var(--sans);box-shadow:0 6px 16px -8px rgba(0,0,0,.5);flex:0 0 auto}
.hm .cta:hover{background:#fff}
.hm .arch{position:absolute;right:-4px;top:-10px;width:164px;height:222px;pointer-events:none}
.hm .quick{margin-top:20px;height:152px;flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hm .qcard{position:relative;background:var(--surface);border-radius:18px;padding:14px 12px 12px;box-shadow:0 1px 2px rgba(23,32,51,.03),0 8px 20px -14px rgba(23,32,51,.12);border:1px solid rgba(231,225,216,.7);display:block;text-align:left;color:var(--ink);height:152px}
.hm .qcard .qi{width:30px;height:30px;border-radius:10px;background:var(--parchment);display:grid;place-items:center;color:var(--ink)}
.hm .qcard b{display:block;font:700 13.5px/16px var(--sans);letter-spacing:-.01em;margin-top:14px}
.hm .qcard p{font:500 10.5px/14px var(--sans);color:var(--gray);margin:6px 0 0}
.hm .qcard .go{position:absolute;right:10px;top:14px;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:#fff;display:grid;place-items:center;color:var(--ink)}
.hm .remind{margin-top:20px;position:relative;height:132px;flex:0 0 auto;background:var(--surface);border-radius:20px;padding:16px 20px;box-shadow:0 1px 2px rgba(23,32,51,.03),0 8px 20px -14px rgba(23,32,51,.12);border:1px solid rgba(231,225,216,.7);overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.hm .remind h3{font:800 17px/22px var(--serif);letter-spacing:-.015em;margin:6px 0 6px;color:var(--ink);max-width:228px}
.hm .remind p{font:500 12px/17px var(--sans);color:var(--gray);margin:0 0 6px;max-width:226px}
.hm .remind .lm{font:700 12.5px/14px var(--sans);color:var(--burgundy);background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:6px;width:max-content}
.hm .remind .lm:hover{text-decoration:underline;text-underline-offset:3px}
.hm .leaf{position:absolute;right:0;top:0;height:100%;width:116px;pointer-events:none}
.homeind-abs{position:absolute;left:0;right:0;bottom:0;z-index:3}

/* onboarding */
.ob-top{height:56px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 20px}
.steps{display:flex;gap:5px}
.steps i{width:22px;height:4px;border-radius:2px;background:var(--border)}
.steps i.on{background:var(--ink)}
.steps i.done{background:var(--ink);opacity:.35}
.skip{background:none;border:0;padding:8px 4px;font:700 14px/1 var(--sans);color:var(--gray)}
.skip:hover{color:var(--ink)}
.art{position:relative;height:318px;flex:0 0 auto;margin:6px 0 4px;display:grid;place-items:center;overflow:hidden}
.art svg{display:block;overflow:visible}
.ob-copy{padding:8px 24px 0;text-align:center}
.ob-copy .hl{font-size:30px}
.ob-copy .body{font-size:15px}
.fine{text-align:center;font:500 12px/1.5 var(--sans);color:var(--gray);margin:0;padding:6px 24px 4px}
.fine b{color:var(--ink)}

/* question screens (Jomo option list) */
.q-top{height:56px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.q-top .line{flex:1;margin:0 14px;height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.q-top .line span{display:block;height:100%;background:var(--ink)}
.q-top .cnt{font:700 12px/1 var(--sans);color:var(--gray)}
.q-copy{padding:20px 24px 14px;text-align:center}
.opt{display:block;cursor:pointer;background:var(--surface);border-radius:16px;box-shadow:var(--sh-card);width:100%;text-align:left;border:0;padding:0;color:var(--ink);overflow:hidden}
.opt .h .tx{flex:1;min-width:0;display:block}
.opt .h .t{display:block}
.opt .h .s{display:block;font:500 12.5px/16px var(--sans);color:var(--gray);margin-top:2px}
.opt .h{display:flex;align-items:center;gap:12px;padding:15px 16px;font:600 15px/1.3 var(--sans)}
.opt .h span{flex:1}
.opt .h i{width:22px;height:22px;border-radius:50%;border:1.5px solid #CBC3B6;flex:0 0 auto;display:grid;place-items:center;color:var(--parchment)}
.opt.on .h{font-weight:700;font-size:16px}
.opt.on .h i{background:var(--burgundy);border-color:var(--burgundy)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opt .x{display:none;border-top:1px solid var(--border);padding:12px 16px 14px;font:500 13px/1.5 var(--sans);color:var(--gray)}
.opt .x b{color:var(--ink);font-weight:700}
.opt.on .x{display:block}

/* sheets and modals (Jomo stacking) */
.behind{position:absolute;inset:0;transform:scale(.94);transform-origin:50% 0;border-radius:32px;overflow:hidden;filter:brightness(.62)}
.behind .board{border-radius:32px;box-shadow:none}
.dim{position:absolute;inset:0;background:rgba(23,32,51,.25);animation:fade .25s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;top:56px;background:var(--surface);border-radius:32px 32px 0 0;box-shadow:0 -8px 32px rgba(23,32,51,.14);display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.sheet.deep{top:96px}
.sheet .handle{width:36px;height:5px;border-radius:3px;background:#CBC3B6;margin:10px auto 8px;flex:0 0 auto}
.sheet .head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px;flex:0 0 auto}
.sheet .head h3{font:700 17px/1.2 var(--sans);margin:0;text-align:center;flex:1}
.sheet .stack{background:transparent}
.sheet .card,.sheet .group,.sheet .opt,.sheet .banner{background:var(--white)}
.modal{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--surface);border-radius:24px;padding:26px 22px 20px;box-shadow:var(--sh-float);text-align:center;animation:in .25s ease}
.modal .ring{width:76px;height:76px;border-radius:50%;background:var(--parchment);display:grid;place-items:center;margin:0 auto 16px}
.modal .ring i{width:46px;height:46px;border-radius:50%;background:var(--ink);display:grid;place-items:center;color:var(--parchment)}
.modal h3{font:800 24px/1.2 var(--serif);margin:0 0 8px;letter-spacing:-.01em}
.modal p{font:500 14px/1.5 var(--sans);color:var(--gray);margin:0 0 18px}

/* people */
.person{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:0;color:var(--ink)}
.av{width:38px;height:38px;border-radius:50%;background:var(--parchment);display:grid;place-items:center;font:700 12px/1 var(--sans);color:var(--ink);flex:0 0 auto}
.profile-head{display:flex;align-items:center;gap:14px;padding:2px 16px 10px}
.profile-head .bigav{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--parchment);display:grid;place-items:center;font:800 22px/1 var(--serif)}
.profile-head b{display:block;font:800 20px/1.15 var(--sans);letter-spacing:-.01em}
.profile-head span{display:block;font:500 12.5px/1.4 var(--sans);color:var(--gray);margin-top:3px}
.input{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:14px;background:var(--surface);box-shadow:var(--sh-card);color:var(--ink);font:500 15px/1 var(--sans)}
.input svg{color:var(--gray);flex:0 0 auto}
.input .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:grid;gap:7px}
.field label{font:700 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gray);display:flex;justify-content:space-between;align-items:baseline}
.divider{display:flex;align-items:center;gap:12px;color:var(--gray);font:700 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.check{display:flex;align-items:center;gap:10px;font:500 14px/1 var(--sans);color:var(--ink);background:none;border:0;padding:0}
.check i{width:22px;height:22px;border:1.5px solid #CBC3B6;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--parchment)}
.check.on i{background:var(--ink);border-color:var(--ink)}
.laurel{display:flex;justify-content:center;gap:18px;padding:4px 0 10px}
.laurel div{text-align:center}
.laurel b{display:block;font:800 20px/1.1 var(--sans);letter-spacing:-.01em}
.laurel small{font:600 11px/1.3 var(--sans);color:var(--gray)}

/* ===== Jomo visual language, our colours. SF Pro on Apple devices, Inter elsewhere. ===== */
.j-top{height:56px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.j-lang{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-float);display:grid;place-items:center;font:700 12px/1 var(--sans);color:var(--ink);letter-spacing:.02em}
.j-title{font:800 26px/32px var(--sans);letter-spacing:-.02em;text-align:center;margin:8px 0 0;padding:0 28px;color:var(--ink);text-wrap:balance}
.j-sub{font:500 14px/20px var(--sans);color:var(--gray);text-align:center;margin:8px 32px 0}
.j-kicker{font:700 15px/20px var(--sans);text-align:center;margin:0 0 4px;color:var(--ink)}
.j-legal{font:500 11px/16px var(--sans);color:var(--gray);text-align:center;margin:14px 36px 0}
.j-legal u{text-decoration:underline;text-underline-offset:2px}

/* welcome hero */
.whero{position:relative;height:392px;flex:0 0 auto;background:radial-gradient(120% 80% at 50% -10%,#2E3F69 0%,var(--ink) 52%,#0F1526 100%);color:var(--parchment);overflow:visible}
.whero .status{color:var(--parchment)}
.whero .status svg rect,.whero .status svg path{fill:var(--parchment)!important;stroke:var(--parchment)}
.laurels{display:flex;justify-content:center;gap:22px;padding:18px 16px 14px}
.laurel{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.laurel b{display:inline-flex;align-items:center;gap:2px;font:800 20px/1 var(--sans);letter-spacing:-.01em;white-space:nowrap}
.laurel b svg{width:14px;height:22px;opacity:.85}
.laurel small{display:block;font:500 12px/1.3 var(--sans);color:rgba(243,238,229,.78);margin-top:5px;white-space:nowrap}
.quote{position:relative;text-align:center;padding:0 46px}
.quote .qm{position:absolute;top:-6px;left:24px;font:800 34px/1 Georgia,serif;color:rgba(243,238,229,.85)}
.quote .qm.r{left:auto;right:24px}
.quote p{font:700 15px/21px var(--sans);margin:0}
.quote small{display:block;font:500 11px/1.3 var(--sans);color:rgba(243,238,229,.75);margin-top:3px}
.stars{font-size:10px;letter-spacing:2px;color:var(--parchment);margin-top:6px}
.stars.gold{color:var(--gold)}
.bn{position:absolute;left:24px;right:24px;bottom:-34px;height:196px}
.bn .c{position:absolute;width:186px;height:168px;background:var(--surface);border-radius:20px;padding:16px 16px 14px;box-shadow:0 14px 30px -12px rgba(23,32,51,.35);color:var(--ink);display:flex;flex-direction:column}
.bn .c.before{left:0;top:30px;transform:rotate(-4deg);z-index:1}
.bn .c.now{right:0;top:0;transform:rotate(2deg);z-index:2}
.bn .bl{font:800 17px/1 var(--sans);color:var(--burgundy)}
.bn .nl{font:800 17px/1 var(--sans);color:var(--ink)}
.bn .bv{font:600 13px/1 var(--sans);color:var(--gray);margin-top:8px}
.bn .bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:auto}
.bn .bars i{flex:1;border-radius:3px 3px 0 0;background:var(--sunken)}
.bn .bars.on i{background:var(--ink)}
.wbody{padding-top:46px;text-align:center}

/* phone mockup */
.mockwrap{position:relative;overflow:hidden;margin-top:18px;min-height:0}
.mock{width:272px;height:540px;margin:0 auto;border-radius:44px;background:#0F1526;padding:10px;box-shadow:0 30px 50px -24px rgba(23,32,51,.5)}
.mock-notch{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:84px;height:24px;border-radius:14px;background:#0F1526;z-index:3}
.mock-screen{position:relative;width:100%;height:100%;border-radius:36px;background:var(--parchment);overflow:hidden;padding:52px 18px 0}
.ms-head{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.ms-logo svg{display:block}
.ms-t{font:700 14px/1 var(--sans);color:var(--ink)}
.ms-dot{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-card)}
.ms-row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:var(--sh-card)}
.ms-row i{width:22px;height:22px;border-radius:7px;background:var(--sunken);flex:0 0 auto}
.ms-l{height:8px;border-radius:4px;background:var(--sunken)}
.ms-dim{position:absolute;inset:0;background:rgba(23,32,51,.72);backdrop-filter:blur(3px)}
.ms-lock{position:absolute;left:50%;top:160px;transform:translateX(-50%);width:110px;height:110px;border-radius:50%;display:grid;place-items:center;color:var(--gold)}
.ms-lockglow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(122,38,58,.9) 0%,rgba(122,38,58,.35) 45%,rgba(122,38,58,0) 72%)}
.ms-lock svg{position:relative;stroke-width:1.6}
.ms-msg{position:absolute;left:0;right:0;top:284px;text-align:center;font:700 15px/21px var(--sans);color:#fff;margin:0}
.ms-cta{position:absolute;left:16px;right:16px;top:352px;height:44px;border-radius:999px;background:var(--burgundy);color:#fff;font:700 13px/44px var(--sans);text-align:center;box-shadow:0 10px 24px -10px rgba(122,38,58,.7)}
.ms-ghost{position:absolute;left:32px;right:32px;top:406px;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.85);font:600 11px/34px var(--sans);text-align:center}

/* social proof */
.proof{text-align:center;padding:18px 0 14px}
.proof .stars{margin:0 0 6px}
.proof-n{display:inline-flex;align-items:center;gap:2px;font:800 26px/1 var(--sans);letter-spacing:-.01em;color:var(--gold)}
.proof-n svg{width:16px;height:26px;opacity:.9}
.proof small{display:block;font:600 12px/1.3 var(--sans);color:var(--gold);margin-top:4px}
.reviews{display:flex;gap:12px;overflow-x:auto;padding:12px 0 18px 24px;scrollbar-width:none;min-height:0;align-items:flex-start}
.reviews::-webkit-scrollbar{display:none}
.rv{flex:0 0 232px;background:var(--surface);border-radius:18px;padding:16px;box-shadow:0 10px 26px -14px rgba(23,32,51,.25);display:flex;flex-direction:column;gap:8px;min-height:150px}
.rv b{font:800 15px/20px var(--sans);color:var(--ink)}
.rv p{font:500 13px/19px var(--sans);color:var(--ink);margin:0;flex:1}
.rv .who{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--sans);color:var(--ink)}
.rv .who .stars{margin:0;margin-left:auto;font-size:8px;letter-spacing:1px}
.av.sm{width:22px;height:22px;font-size:9px}

/* mascot */
.mascotwrap{display:grid;place-items:center;min-height:0}
.mascotwrap svg{width:230px;height:230px}

/* name */
.namewrap{display:flex;flex-direction:column;justify-content:center;padding:0 24px;min-height:0}
.namewrap .j-title{padding:0}
.namefield{margin-top:22px;height:56px;border-radius:999px;background:var(--surface);border:1.5px solid var(--border);display:flex;align-items:center;padding:0 18px 0 20px;gap:10px;color:var(--gray)}
.namefield:focus-within{border-color:var(--ink)}
.nameinput{flex:1;min-width:0;border:0;background:none;font:600 15px/1 var(--sans);color:var(--ink);outline:none}
.nameinput::placeholder{color:#A6A9AE;font-weight:500}
.kb{flex:0 0 auto;background:#D4CFC6;padding:8px 4px 10px;display:grid;gap:9px}
.kb .r{display:flex;justify-content:center;gap:5px}
.kb .k{width:32px;height:40px;border-radius:6px;background:var(--surface);box-shadow:0 1px 0 rgba(23,32,51,.25);display:grid;place-items:center;font:500 17px/1 var(--sans);color:var(--ink)}
.kb .k.w{width:46px;background:#BCB6AC;font-size:13px}
.kb .k.sp{width:180px}
.kb .k.ret{width:84px;background:#BCB6AC;font-size:13px}
.kb .util{display:flex;justify-content:space-between;padding:6px 16px 0;font-size:18px;color:var(--ink)}

/* ===== sign-up steps (website flow translated to Jomo-style mobile steps) ===== */
.su-top{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px}
.su-top .line{flex:1;height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.su-top .line span{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.su-top .cnt{font:700 12px/1 var(--sans);color:var(--gray);min-width:28px;text-align:right}
.textlink{background:none;border:0;padding:8px 0;font:700 14px/1 var(--sans);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.textlink:hover{color:var(--burgundy)}
.su-body{padding:6px 24px 0;display:flex;flex-direction:column;gap:12px;min-height:0}
.su-body>*{flex:0 0 auto}
.eb2{font:700 11px/14px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gray);margin:0;text-align:center}
.su-body .j-title{padding:0;margin-top:2px}
.su-body .j-sub{margin:0 8px}
.f2{display:grid;gap:8px}
.f2 label{font:700 11px/14px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.f2 .pill{height:56px;border-radius:999px;background:var(--surface);border:1.5px solid var(--border);display:flex;align-items:center;padding:0 18px 0 20px;gap:10px;color:var(--gray)}
.f2 .pill:focus-within{border-color:var(--ink)}
.f2 .pill.bad{border-color:var(--burgundy)}
.f2 .pill input{flex:1;min-width:0;border:0;background:none;font:600 15px/1 var(--sans);color:var(--ink);outline:none}
.f2 .pill input::placeholder{color:#A6A9AE;font-weight:500}
.f2 .pill button{background:none;border:0;padding:0;color:var(--gray);display:grid;place-items:center}
.f2 .help{font:500 12px/16px var(--sans);color:var(--gray);margin:0;font-style:italic}
.rules{display:grid;gap:8px;margin-top:4px}
.rule2{display:flex;align-items:center;gap:10px;font:500 13.5px/18px var(--sans);color:var(--gray)}
.rule2 i{width:20px;height:20px;border-radius:50%;border:1.5px solid #CBC3B6;display:grid;place-items:center;color:var(--parchment);flex:0 0 auto;transition:background .15s,border-color .15s}
.rule2.ok{color:var(--ink)}
.rule2.ok i{background:var(--ink);border-color:var(--ink)}
.ackbar{display:flex;align-items:center;justify-content:space-between;font:700 11px/14px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gray)}
.ackbar b{font:700 13px/1 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink)}
.ackbar b span{color:var(--gray);font-weight:500}
.acktrack{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden;margin-top:-4px}
.acktrack span{display:block;height:100%;background:var(--ink);transition:width .25s}
.ack{background:var(--surface);border-radius:16px;box-shadow:var(--sh-card);overflow:hidden}
.ack .h{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;background:none;border:0;text-align:left;color:var(--ink);font:600 15px/20px var(--sans)}
.ack .row{display:flex;align-items:center}
.ack .row .cb{margin:14px 0 14px 16px}
.ack .row .h{flex:1;width:auto;padding:14px 16px 14px 12px}
.ack .h span:not(.cb){flex:1}
.ack .h span.cb{flex:0 0 auto}
.ack .h .chv{color:var(--gray);transition:transform .2s}
.ack.open .h .chv{transform:rotate(90deg)}
.ack .body{display:none;padding:0 16px 14px 50px;font:500 13px/19px var(--sans);color:var(--gray)}
.ack.open .body{display:block}
.cb{width:22px;height:22px;border-radius:7px;border:1.5px solid #CBC3B6;background:var(--surface);display:grid;place-items:center;color:var(--parchment);flex:0 0 auto;padding:0}
.cb.on{background:var(--ink);border-color:var(--ink)}
.ack.master{background:#FBF4E8;border:1.5px dashed var(--gold);box-shadow:none}
.ack.master .h{font-weight:700}
.dock .help{text-align:center;font:500 12px/16px var(--sans);color:var(--gray);margin:0}
.fineprint{font:500 11px/15px var(--sans);color:var(--gray);text-align:center;margin:0;padding:4px 32px 0}

/* your path timeline */
.path{display:grid;gap:0;padding:6px 24px 0}
.step{display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:start;position:relative;padding-bottom:18px}
.step::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--border)}
.step:last-child::before{display:none}
.step .n{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font:700 12px/1 var(--sans);background:var(--surface)}
.step.cur .n{background:var(--ink);border-color:var(--ink);color:var(--parchment)}
.step b{display:block;font:700 15px/20px var(--sans);color:var(--ink);padding-top:6px}
.step small{display:block;font:500 13px/18px var(--sans);color:var(--gray);margin-top:2px}
.step .chip{margin-top:6px}
.what{margin:0 24px;background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--sh-card);display:grid;gap:4px}
.what .eb2{text-align:left}
.what b{font:700 15px/20px var(--sans);color:var(--ink)}
.what b em{font-style:normal;color:var(--gold)}
.what p{font:500 13px/18px var(--sans);color:var(--gray);margin:0}

/* notifications ask */
.notifart{display:grid;place-items:center;padding:10px 0 14px}
.notifcard{width:262px;background:var(--surface);border-radius:18px;box-shadow:var(--sh-float);padding:14px;display:flex;gap:12px;align-items:center}
.notifcard .ic{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--parchment);display:grid;place-items:center;flex:0 0 auto}
.notifcard b{display:block;font:700 13px/17px var(--sans);color:var(--ink)}
.notifcard small{display:block;font:500 12px/16px var(--sans);color:var(--gray)}
.benefits{display:grid;gap:14px;padding:12px 32px 0;align-content:start}
.benefit{display:flex;gap:12px;align-items:flex-start;font:500 14px/19px var(--sans);color:var(--gray)}
.benefit b{display:block;font:700 14px/19px var(--sans);color:var(--ink)}
.benefit .bi{width:28px;height:28px;border-radius:9px;background:var(--surface);box-shadow:var(--sh-card);display:grid;place-items:center;color:var(--ink);flex:0 0 auto}

/* ===== where to begin (website chooser) ===== */
.choice{display:flex;flex-direction:column;gap:14px;padding:16px 16px 0}
.choice>*{flex:0 0 auto}
.opt{position:relative;background:var(--surface);border-radius:20px;box-shadow:var(--sh-card);padding:18px 16px 16px;display:grid;grid-template-columns:44px 1fr 20px;column-gap:14px;align-items:start;text-align:left;border:1.5px solid transparent;cursor:pointer;transition:transform .12s}
.opt:active{transform:scale(.985)}
.opt.hero{border-color:var(--gold)}
.opt .ci{width:44px;height:44px;border-radius:14px;background:var(--ink);color:var(--parchment);display:grid;place-items:center;grid-column:1;grid-row:1/4}
.opt b{grid-column:2;grid-row:1;font:700 17px/22px var(--sans);color:var(--ink);letter-spacing:-.01em}
.opt .chv{grid-column:3;grid-row:1;color:var(--gray);margin-top:1px}
.opt p{grid-column:2/4;grid-row:2;margin:4px 0 0;font:500 13.5px/19px var(--sans);color:var(--gray)}
.opt .for{grid-column:2/4;grid-row:3;margin-top:10px;font:600 12px/16px var(--sans);color:var(--gold)}
.opt .badge{position:absolute;top:0;right:16px;height:20px;padding:0 10px;border-radius:0 0 10px 10px;background:var(--gold);color:var(--ink);font:700 10px/20px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.opt.hero{padding-top:30px}
.opt .tag{display:inline-block;margin-left:6px;vertical-align:2px;font:700 10px/18px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:0 8px}
.hint{text-align:center;padding:10px 32px 6px;display:grid;justify-items:center;gap:3px;flex:0 0 auto}
.hint .hi{color:var(--gray);opacity:.7}
.hint b{font:700 14px/18px var(--sans);color:var(--ink)}
.hint small{font:500 12px/16px var(--sans);color:var(--gray)}

/* ===== plans (Jomo option rows that expand when selected) ===== */
.plans{display:flex;flex-direction:column;gap:10px;padding:18px 16px 0}
.plans>*{flex:0 0 auto}
.plan{position:relative;background:var(--surface);border-radius:20px;box-shadow:var(--sh-card);border:1.5px solid transparent;overflow:hidden;cursor:pointer}
.plan.on{border-color:var(--ink)}
.plan .h{display:flex;align-items:center;gap:12px;padding:16px}
.plan .rd{width:22px;height:22px;border-radius:50%;border:1.5px solid #CBC3B6;display:grid;place-items:center;flex:0 0 auto;background:var(--surface)}
.plan .rd i{width:12px;height:12px;border-radius:50%;background:var(--ink);opacity:0;transform:scale(.5);transition:all .15s}
.plan.on .rd{border-color:var(--ink)}
.plan.on .rd i{opacity:1;transform:scale(1)}
.plan .t{flex:1;min-width:0}
.plan .t b{display:block;font:700 15.5px/20px var(--sans);color:var(--ink)}
.plan .t small{display:block;font:500 12.5px/16px var(--sans);color:var(--gray);margin-top:2px}
.plan .pr{text-align:right;flex:0 0 auto;max-width:110px}
.plan .pr b{display:block;font:800 19px/22px var(--sans);color:var(--ink);letter-spacing:-.02em}
.plan .pr small{display:block;font:600 11px/14px var(--sans);color:var(--gray)}
.plan .body{display:none;padding:0 16px 16px 50px;font:500 13px/19px var(--sans);color:var(--gray)}
.plan.on .body{display:block}
.plan .body ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.plan .body li{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-weight:600;font-size:13px;line-height:18px}
.plan .body li svg{flex:0 0 auto;margin-top:2px;color:var(--gold)}
.plan .body .inc{margin-top:10px;font:600 12px/16px var(--sans);color:var(--gray)}
.plan .badge{position:absolute;top:0;right:16px;padding:0 10px;height:20px;border-radius:0 0 10px 10px;background:var(--gold);color:var(--ink);font:700 10px/20px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.plan.has-badge .h{padding-top:26px}

/* ===== family members stepper ===== */
.stepper{display:flex;align-items:center;justify-content:center;gap:28px;padding:26px 0 8px;flex:0 0 auto}
.stepper button{width:54px;height:54px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--sh-float);color:var(--ink);font:600 28px/1 var(--sans);display:grid;place-items:center;padding:0}
.stepper button:disabled{opacity:.35}
.stepper .num{font:800 64px/1 var(--sans);color:var(--ink);letter-spacing:-.04em;min-width:80px;text-align:center}
.famcard{margin:18px 24px 0;background:var(--surface);border-radius:16px;box-shadow:var(--sh-card);padding:14px 16px;display:grid;gap:8px}
.famcard .r{display:flex;justify-content:space-between;gap:12px;font:500 13.5px/18px var(--sans);color:var(--gray)}
.famcard .r b{color:var(--ink);font-weight:700;white-space:nowrap}
.famcard .r.tot{border-top:1px solid var(--border);padding-top:8px}

/* ===== my vault intro ===== */
.vscroll{display:flex;flex-direction:column}
.vscroll>*{flex:0 0 auto}
.vhero{margin:4px 16px 0;background:linear-gradient(160deg,#1C2740,#0F1526);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.vhero .eb2{color:var(--gold);text-align:left;margin:0}
.vhero h2{font:800 21px/26px var(--sans);letter-spacing:-.02em;margin:8px 96px 0 0;padding:0;text-align:left;color:#fff}
.vhero p.d{font:500 12.5px/17px var(--sans);color:rgba(243,238,229,.8);margin:10px 0 0}
.vhero .vi{position:absolute;right:-10px;top:-10px;width:104px;height:104px;border-radius:50%;border:1.5px solid rgba(200,164,92,.35);display:grid;place-items:center;color:var(--gold)}
.vhero .vi::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(200,164,92,.25)}
.feat{display:flex;flex-direction:column;gap:10px;padding:14px 16px 0}
.feat>*{flex:0 0 auto}
.fe{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;box-shadow:var(--sh-card);padding:12px 14px}

.pricecard b{font:800 24px/26px var(--sans);color:var(--ink);letter-spacing:-.02em}
.pricecard b small{font:600 12px/14px var(--sans);color:var(--gray);letter-spacing:0;margin-left:5px}
.pricecard p{margin:3px 0 0;font:500 12px/16px var(--sans);color:var(--gray)}
.pricecard .chip{flex:0 0 auto}
.xlink{margin:10px 16px 0;display:flex;align-items:center;gap:12px;background:none;border:1.5px dashed #D3CBBE;border-radius:16px;padding:12px 14px;text-align:left;color:var(--ink);cursor:pointer}

 profile:{cap:['23 · Profile','Row groups with toggles'],root:true,tab:'profile',render:function(){

var ORDER=['welcome','ob1','ob2','su0','su1','su2','su3','su4','begin','plans','family','vaultintro','path','notif','home','signin','will','q1','q2','done','people','rel','vault','profile'];

/* ---------- engine ---------- */
var stage=document.getElementById('stage'), where=document.getElementById('where');
var stack=['welcome'];
function current(){return stack[stack.length-1]}
function render(dir){
  var name=current(), sc=SCREENS[name];
  stage.innerHTML='<section class="board'+(dir==='back'?' back':'')+'" data-screen="'+name+'">'+sc.render()+'</section>';
  where.textContent=sc.cap[0]+' · '+sc.cap[1];
  var nm=stage.querySelector('#nm,#legal,#email,#pw');if(nm&&!nm.value)setTimeout(function(){try{nm.focus();}catch(e){}},50);
  document.getElementById('t-back').disabled=stack.length<2;
  document.querySelectorAll('.thumb').forEach(function(t){t.classList.toggle('on',t.getAttribute('data-screen')===name)});
  refreshThumbs();
}
function go(name){if(current()===name)return;stack.push(name);render('fwd');}
function back(){if(stack.length>1){stack.pop();render('back');}}
function tab(name){stack=['home'];if(name!=='home')stack.push(name);render('fwd');}
function toast(msg){
  var old=stage.querySelector('.toast');if(old)old.remove();
  var t=document.createElement('div');t.className='toast';t.innerHTML=ic('i-check',18)+'<span>'+msg+'</span>';stage.appendChild(t);
  setTimeout(function(){if(t.parentNode)t.remove();},2200);
}
stage.addEventListener('click',function(e){
  var b=e.target.closest('button,[role="button"]');if(!b)return;
  if(b.closest('.behind'))return;
  var a;
  if(b.hasAttribute('data-toast'))toast(b.getAttribute('data-toast'));
  if(b.hasAttribute('data-pick')){S[b.getAttribute('data-pick')]=b.getAttribute('data-val');render();return;}
  if(a=b.getAttribute('data-act')){
    if(a==='keep'){S.keep=!S.keep;render();}
    else if(a==='kids+'){S.children=Math.min(12,S.children+1);render();}
    else if(a==='kids-'){S.children=Math.max(0,S.children-1);render();}
    else if(a==='finish-heirs'){S.sections[3].done=true;stack=['home','will','done'];render('fwd');}
    else if(a==='witness'){S.witnesses=Math.min(2,S.witnesses+1);render();toast(S.witnesses<2?'Invitation sent to Omar Khalil':'Invitation sent to Sara Ali');}
    else if(a==='adddoc'){S.docs.push({n:'Government ID',s:'Uploaded just now',ic:'i-id'});render();toast('Government ID added to your vault');}
    else if(a==='faceid'){S.faceid=!S.faceid;render();}
    else if(a==='signout'){stack=['welcome'];render('back');}
    else if(a==='setname'){S.user=(S.name||'').trim()||S.user;stack.push('su0');render('fwd');toast('Nice to meet you, '+S.user+'.');}
    else if(a==='social'){S.email=S.email||(S.user.toLowerCase()+'@gmail.com');stack.push('su1');render('fwd');toast('Signed in with your provider. A few details next.');}
    else if(a==='pwshow'){S.pwShow=!S.pwShow;var pw=stage.querySelector('#pw');if(pw){pw.type=S.pwShow?'text':'password';pw.focus();}}
    else if(a==='ack-open'){var i=+b.getAttribute('data-i');S.ackOpen=(S.ackOpen===i?-1:i);render();}
    else if(a==='ack-check'){var j=+b.getAttribute('data-i');S.ack[j]=!S.ack[j];render();}
    else if(a==='ack-all'){var allOn=S.ack.every(Boolean);S.ack=S.ack.map(function(){return !allOn});render();}
    else if(a==='create'){if(!S.ack.every(Boolean))return;stack=['begin'];render('fwd');toast('Account created for '+(S.legal.trim()||S.user)+'.');}
    else if(a==='finish'){stack=['home'];render('fwd');}
    else if(a==='plan'){S.plan=+b.getAttribute('data-i');render();}
    else if(a==='pickplan'){if(S.plan<0)return;if(S.plan===2){stack.push('family');render('fwd');}else{stack=['path'];render('fwd');toast(PLANS[S.plan].name+' selected.');}}
    else if(a==='fam'){S.fam=Math.min(8,Math.max(1,S.fam+(+b.getAttribute('data-d'))));render();}
    else if(a==='pickfam'){stack=['path'];render('fwd');toast('Family package for '+S.fam+' selected.');}
    else if(a==='startvault'){S.vault=true;stack=['notif'];render('fwd');toast('My Vault started at $7.99 CAD /mo.');}
    else if(a==='rel-tab-0'){S.relTab=0;S.relPick=null;render();}
    else if(a==='rel-tab-1'){S.relTab=1;S.relPick=null;render();}
    else if(a==='rel-pick'){S.relPick=b.getAttribute('data-val');render();}
    else if(a==='rel-confirm'){if(!S.relPick)return;var r=S.relPick;S.people.push({n:'New '+r.toLowerCase(),r:r,role:'',i:r.slice(0,2).toUpperCase()});S.relPick=null;stack=['home','people'];render('back');toast(r+' added. Fill in their details next.');}
    return;
  }
  if(b.hasAttribute('data-back')){back();return;}
  if(a=b.getAttribute('data-tab')){tab(a);return;}
  if(a=b.getAttribute('data-go')){go(a);return;}
});
stage.addEventListener('input',function(e){var t=e.target;if(!t)return;var dockBtn=stage.querySelector('.dock .btn.primary');
  if(t.id==='nm'){S.name=t.value;var b=stage.querySelector('[data-act="setname"]');if(b)b.disabled=!S.name.trim();}
  else if(t.id==='legal'){S.legal=t.value;if(dockBtn)dockBtn.disabled=!(S.legal.trim().split(/\s+/).length>=2&&S.legal.trim().length>3);}
  else if(t.id==='email'){S.email=t.value;if(dockBtn)dockBtn.disabled=!validEmail(S.email);}
  else if(t.id==='pw'){S.pw=t.value;var r=stage.querySelector('#rules');if(r)r.innerHTML=pwRulesHTML();if(dockBtn)dockBtn.disabled=!pwOK();}
});
stage.addEventListener('keydown',function(e){var b=e.target.closest('[role="button"]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();b.click();}});
document.getElementById('t-back').addEventListener('click',back);
document.getElementById('t-restart').addEventListener('click',function(){stack=['welcome'];render('back');});
document.getElementById('t-home').addEventListener('click',function(){tab('home');});

/* ---------- gallery ---------- */
var thumbs=document.getElementById('thumbs');
function thumbHTML(name){var sc=SCREENS[name];return '<div class="cap"><b>'+sc.cap[0]+'</b><span>'+sc.cap[1]+'</span></div><div class="frame"><section class="board" aria-hidden="true">'+sc.render()+'</section></div>'}
var PRE={ob1:['welcome'],ob2:['welcome','ob1'],ob3:['welcome','ob1','ob2'],ob4:['welcome','ob1','ob2'],su0:['welcome','ob1','ob2'],su1:['welcome','ob1','ob2','su0'],su2:['welcome','ob1','ob2','su0','su1'],su3:['welcome','ob1','ob2','su0','su1','su2'],su4:['welcome','ob1','ob2','su0','su1','su2','su3'],begin:['welcome'],plans:['welcome','begin'],family:['welcome','begin','plans'],vaultintro:['welcome','begin'],path:['welcome','begin','plans'],notif:['welcome','path'],signin:['welcome'],q1:['home','will'],q2:['home','will','q1'],done:['home','will'],people:['home'],rel:['home','people']};
ORDER.forEach(function(name){
  var t=document.createElement('button');t.type='button';t.className='thumb';t.setAttribute('data-screen',name);
  t.innerHTML=thumbHTML(name);
  t.addEventListener('click',function(){
    var sc=SCREENS[name];
    if(sc.root){stack=[name];if(sc.tab&&name!=='home')stack=['home',name];}
    else{stack=(PRE[name]||['home']).concat([name]);}
    render('fwd');
  });
  thumbs.appendChild(t);
});
var pending=false;
function refreshThumbs(){ if(pending)return; pending=true; setTimeout(function(){pending=false; ORDER.forEach(function(n){var t=thumbs.querySelector('[data-screen="'+n+'"]');if(t)t.innerHTML=thumbHTML(n);}); scaleThumbs();},0); }
function scaleThumbs(){document.querySelectorAll('.thumb .frame').forEach(function(f){var s=f.clientWidth/390;var b=f.querySelector('.board');if(b)b.style.transform='scale('+s+')';});}
function scalePhone(){
  var wrap=document.getElementById('phonewrap'),sim=wrap.parentNode;
  var availH=(window.innerWidth>=980?window.innerHeight:Math.min(window.innerHeight,760))-118;
  var availW=sim.clientWidth-32;
  wrap.style.setProperty('--s',Math.min(1,availH/860,availW/406).toFixed(3));
}
window.addEventListener('resize',function(){scaleThumbs();scalePhone();});
(function(){var k=(location.hash||'').replace('#','')||((location.search.match(/[?&]screen=([a-z0-9]+)/)||[])[1]||'');if(SCREENS[k]){var sc=SCREENS[k];if(sc.root){stack=[k];if(sc.tab&&k!=='home')stack=['home',k];}else{stack=(PRE[k]||['home']).concat([k]);}}})();
scaleThumbs();scalePhone();render();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(scaleThumbs);}
})();
</script>
